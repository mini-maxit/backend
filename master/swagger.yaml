    x-enum-varnames:
    - WorkerStatusIdle
    - WorkerStatusBusy
    - WorkerStatusInvalid
info:
  contact: {}
  title: Mini-Maxit API
  version: 1.0.0
paths:
  /access-control/resources/{resource_type}/{resource_id}/assignable:
    get:
      description: List users (teachers) who can be granted access for the given resource.
        Only users with manage permission can view assignable users. Returned users
        do not currently have any access entry for the resource.
      parameters:
      - description: Resource type (contests|tasks|groups)
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: integer
      - description: Pagination limit
        in: query
        name: limit
        type: integer
      - description: Pagination offset
        in: query
        name: offset
        type: integer
      - description: Sort fields, e.g. 'id:asc,created_at:desc'
        in: query
        name: sort
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-schemas_PaginatedResult-array_schemas_User'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Get assignable users for a resource
      tags:
      - access-control
  /access-control/resources/{resource_type}/{resource_id}/collaborators:
    get:
      description: Get all collaborators for a specific resource. Users with edit
        permission or higher can see collaborators.
      parameters:
      - description: Resource type (contests|tasks|groups)
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-array_schemas_Collaborator'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Get collaborators for a resource
      tags:
      - access-control
    post:
      consumes:
      - application/json
      description: Add a user as a collaborator to a resource (contest, task, etc.)
        with specified permissions (edit or manage). Only users with manage permission
        can add collaborators.
      parameters:
      - description: Resource type (contests)
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: integer
      - description: Collaborator details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schemas.AddCollaborator'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-httputils_MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.ValidationErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Add a collaborator to a resource
      tags:
      - access-control
  /access-control/resources/{resource_type}/{resource_id}/collaborators/{user_id}:
    delete:
      description: Remove a user's collaborator access to a resource. Only users with
        manage permission can remove collaborators. Cannot remove the creator.
      parameters:
      - description: Resource type (contests|tasks|groups)
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: integer
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-httputils_MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Remove a collaborator from a resource
      tags:
      - access-control
    put:
      consumes:
      - application/json
      description: Update the permission level of a collaborator for a resource. Only
        users with manage permission can update collaborators.
      parameters:
      - description: Resource type (contests|tasks|groups)
        in: path
        name: resource_type
        required: true
        type: string
      - description: Resource ID
        in: path
        name: resource_id
        required: true
        type: integer
      - description: User ID
        in: path
        name: user_id
        required: true
        type: integer
      - description: New permission
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/schemas.UpdateCollaborator'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-httputils_MessageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.ValidationErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputils.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Update a collaborator's permission for a resource
      tags:
      - access-control
  /auth/login:
    post:
      consumes:
      - application/json
      description: Logs in a user with email and password, returns JWT tokens
      parameters:
      - description: User Login Request
        in: body
        name: request
