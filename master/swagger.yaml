            $ref: '#/definitions/httputils.APIError'
      summary: Logout a user
      tags:
      - auth
  /auth/refresh:
    post:
      description: Refreshes JWT tokens using a valid refresh token from cookie
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputils.APIResponse-routes_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputils.APIError'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Refresh JWT tokens
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Registers a user with name, surname, email, username and password,
        returns JWT tokens
      parameters:
      - description: User Register Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/schemas.UserRegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/httputils.APIResponse-routes_AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputils.ValidationErrorResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/httputils.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputils.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httputils.APIError'
      summary: Register a user
      tags:
      - auth
  /contests:
    get:
      description: Get global contests accessible to the (ongoing, upcoming, past)
