        items:
          type: integer
        type: array
    type: object
  schemas.UserInfo:
    properties:
      id:
        type: integer
      name:
        type: string
      surname:
        type: string
      username:
        type: string
    type: object
  schemas.UserLoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  schemas.UserRegisterRequest:
    properties:
      confirmPassword:
        type: string
      email:
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      password:
        maxLength: 50
        minLength: 8
        type: string
      surname:
        maxLength: 50
        minLength: 3
        type: string
      username:
        maxLength: 30
        minLength: 3
